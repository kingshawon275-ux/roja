<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="50%" stop-color="#d20000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d20000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Dark Circle Background -->
  <circle cx="32" cy="32" r="30" fill="#0d0f14" stroke="#1f242e" stroke-width="2"/>
  
  <!-- Red Card Icon (Tilted) -->
  <g transform="translate(18, 12) rotate(12 14 20)" filter="url(#glow)">
    <rect x="0" y="0" width="28" height="40" rx="4" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Subtle shine strip -->
    <path d="M2 2 L26 2 L16 38 L2 38 Z" fill="white" opacity="0.12"/>
    <!-- Soccer ball accent inside card -->
    <circle cx="14" cy="20" r="7" fill="white" opacity="0.9"/>
    <polygon points="14,15 18,18 16,23 12,23 10,18" fill="#d20000"/>
    <line x1="14" y1="15" x2="14" y2="13" stroke="#d20000" stroke-width="1.2"/>
    <line x1="18" y1="18" x2="20" y2="17" stroke="#d20000" stroke-width="1.2"/>
    <line x1="16" y1="23" x2="18" y2="25" stroke="#d20000" stroke-width="1.2"/>
    <line x1="12" y1="23" x2="10" y2="25" stroke="#d20000" stroke-width="1.2"/>
    <line x1="10" y1="18" x2="8" y2="17" stroke="#d20000" stroke-width="1.2"/>
  </g>
</svg>
